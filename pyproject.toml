[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timbre-ai-agent"
version = "0.2.0"
description = "Observable conversational assistant with controlled-access data foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openrouter==1.3.107", "python-dotenv==1.2.2"]

[project.optional-dependencies]
web = ["streamlit==1.66.0"]

[project.scripts]
timbre = "timbre.cli:main"

[tool.setuptools.package-data]
timbre = ["resources/*.toml", "resources/*.md", "resources/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

